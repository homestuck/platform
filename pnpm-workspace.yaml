  '@chromatic-com/storybook': ^5.6.0
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  '@commitlint/config-pnpm-scopes': ^21.2.2
  '@dotenvx/dotenvx': ^2.38.2
  '@shadcn/lint': ^0.2.5
  '@t3-oss/env-core': ^0.13.11
  '@terrazzo/cli': ^2.10.0
  '@turbo/gen': ^2.11.13
  '@types/node': ^26.6.6
  '@unpunnyfuns/swatchbook-addon': ^2.2.0
  'chromatic': ^18.15.2
  'class-variance-authority': ^0.7.1
  'cn': ^0.5.2
  'date-fns': ^4.4.0
  'eslint-plugin-react-you-might-not-need-an-effect': ^1.3.2
  'eslint-plugin-regexp': ^3.3.3
  'graphql': ^16.15.0
  'inflection': ^3.0.2
  'lint-staged': ^17.6.2
  'playwright': ^1.65.1
  'postcss': ^8.5.33
  'remark-gfm': ^4.0.1
  'style-dictionary': ^5.8.0
  'style-dictionary-utils': ^6.0.1
  'tsx': ^4.23.15
  'turbo': ^2.11.13
  'typescript': ^7.0.2
  'zod': ^4.6.7
catalogs:
  nextjs:
    'next': ^16.4.6
    'next-sitemap': ^4.2.3
    'next-themes': ^0.4.6
  payload:
    '@payloadcms/admin-bar': 4.0.0-beta.11
    '@payloadcms/db-mongodb': 4.0.0-beta.11
    '@payloadcms/graphql': 4.0.0-beta.11
    '@payloadcms/next': 4.0.0-beta.11
    '@payloadcms/richtext-lexical': 4.0.0-beta.11
    '@payloadcms/plugin-form-builder': 4.0.0-beta.11
    '@payloadcms/plugin-redirects': 4.0.0-beta.11
    '@payloadcms/plugin-search': 4.0.0-beta.11
    '@payloadcms/plugin-seo': 4.0.0-beta.11
    '@payloadcms/storage-s3': 4.0.0-beta.11
    '@payloadcms/transformer-sharp': 4.0.0-beta.11
    '@payloadcms/translations': 4.0.0-beta.11
    '@payloadcms/typescript-plugin': 4.0.0-beta.11
    '@payloadcms/ui': 4.0.0-beta.11
    'oxlint-plugin-payload': ^0.1.0
    'payload': 4.0.0-beta.11
  react:
    '@base-ui/react': ^1.9.0
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    'babel-plugin-react-compiler': ^1.0.0
    'cmdk': ^1.1.1
    'lucide-react': ^1.79.0
    'react': ^19.3.1
    'react-day-picker': ^10.0.2
    'react-dom': ^19.3.1
    'react-hook-form': ^7.92.0
    'sonner': ^2.0.8
  storybook:
    '@storybook-community/storybook-dark-mode': ^7.1.4
    '@storybook/addon-a11y': ^10.6.8
    '@storybook/addon-docs': ^10.6.8
    '@storybook/addon-links': ^10.6.8
    '@storybook/addon-themes': ^10.6.8
    '@storybook/addon-vitest': ^10.6.8
    '@storybook/nextjs-vite': ^10.6.8
    'storybook': ^10.6.8
  tailwindcss:
    '@tailwindcss/turbopack': ^4.3.5
    '@tailwindcss/vite': ^4.3.5
    'tailwindcss': ^4.3.5
    'tw-animate-css': ^1.4.0
  typescript-compat:
    '@typescript/native': npm:typescript@^7.0.2
    'typescript': npm:@typescript/typescript6@^6.0.2
  vite:
    '@vitest/browser-playwright': 5.1.1
    '@vitest/coverage-v8': 5.1.1
    'vite': npm:@voidzero-dev/vite-plus-core@8.3.8001
    'vitest': 5.1.1
    'vite-plus': 1.8.0
minimumReleaseAgeExclude:
  - '@next/*'
  - '@oxfmt/*'
  - '@payloadcms/*'
  - '@storybook/*'
  - '@tailwindcss/*'
  - '@turbo/*'
  - '@types/*'
  - '@vitest/*'
  - '@voidzero-dev/*'
  - chromatic
  - eslint-plugin-react-you-might-not-need-an-effect
  - lucide-react
  - next
  - oxfmt
  - oxlint
  - payload
  - storybook
  - tailwindcss
  - turbo
  - vitest
  - vite
  - vite-plus
nodeVersion: 26.13.1
overrides:
  'storybook@*>vite-plus:peer': catalog:vite
  'vite@*': catalog:vite
  'vite-tsconfig-paths': next
  'vitest@*': catalog:vite
packages:
  - 'apps/*'
  - 'packages/*'
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
permissions:
  payload:
    skills: false
versioning:
  lanes:
    'packages/*': alpha
  fixed:
    - ['packages/*']
