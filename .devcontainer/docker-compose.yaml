services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Syncs your codebase workspace
      - ..:/workspace:cached
      # Persists the pnpm 12 high-performance cache store
      - pnpm-store:/node_modules/.pnpm-store
    # Set the working directory inside the container
    working_dir: /workspaces/${localWorkspaceFolderBasename}
    # environment:
    #   # Explicitly state the exact path to align with pnpm v12 architecture
    #   - PNPM_CONFIG_STORE_DIR=/workspace/node_modules/.pnpm-store

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
volumes:
  pnpm-store:
